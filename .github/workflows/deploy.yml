name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Supabase project URL and publishable key — safe to expose publicly,
          # access is governed by Row Level Security, not by hiding these values.
          VITE_SUPABASE_URL: https://rhnuhvbejohvviowjtds.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_YdrM4Qg9hc-M_fZM1Ph3Dg_n7sosYXN
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
